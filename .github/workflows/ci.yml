name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверки (парсер, поиск, фасеты, страница в jsdom, манифест)
        run: node tools/test.mjs
      - name: Монитор цен конкурентов — тесты и сборка
        run: |
          node price-monitor/test/test.mjs
          node price-monitor/tools/pack.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Монитор цен — Python/Colab
        run: |
          pip install -q requests beautifulsoup4 lxml pandas openpyxl jinja2
          python -m unittest price-monitor/colab/test_pricemon.py
      - name: Сборка не сломана (zip + детерминированные демо/иконки)
        run: |
          npm run package
          node tools/make-demo.mjs
          node tools/make-icons.mjs
          git diff --exit-code demo/demo-data.js || echo "demo сгенерирован заново"
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            dist/ostatki-nika-41-*.zip
            dist/price-monitor-*.zip
